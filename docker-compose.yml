services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: ./backend/.env
    environment:
      DATABASE_URL: sqlite:////data/legal.db
      DATA_DIR: /data                      # uploaded originals live next to the database, so ingestion can resume after a restart
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: '["http://localhost:8082"]'
    volumes: [data:/data]
  web:
    build: ./frontend
    ports: ["8082:80"]
    depends_on: [api]
volumes:
  data:
